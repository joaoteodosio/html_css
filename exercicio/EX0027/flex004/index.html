<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box alinhamento</title>
    <style>

        .conteiner{
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
            justify-content:space-evenly;
            
            
            height: 200px;
            border-radius: 5px;
            flex-direction:row;
        }

        .item{
            background-color: brown;
            padding: 10px;
            border: 2px solid blue;
            text-align: center;
            
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplo de bloco A</div>
        <div class="item">Exemplo de bolco B</div>
        <div class="item">Exemplo de bolco C</div>
        <div class="item">Exemplo de bolco D</div>
        <div class="item">Exemplo de bolco E</div>
        <div class="item">Exemplo de bolco F</div>
        <div class="item">Exemplo de bolco G</div>
        <div class="item">Exemplo de bolco H</div>

    </div>
</body>
</html>
