<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box align- self</title>
    <style>

        .conteiner{
            background-color: blue;
            display: flex;
            flex-flow: row wrap;
            padding: 2px;
            align-items: flex-start;
            height: 400px;
            border-radius: 5px;
        }

        .item{
            background-color: brown;
            flex: auto;
            border: 2px solid black;
            text-align: center;
            padding: 20px;
            
        }

        div#i1{

        }
    

div#i2{
    
}


div#i3{
    align-self: flex-end;
    
}


div#i4{
    
}


div#i5{
    align-self: center;
    
}


div#i6{
    
}


div#i7{
    align-self: stretch;
    
}

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
</body>
</html>
