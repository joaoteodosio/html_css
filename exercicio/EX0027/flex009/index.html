<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box basis- auto</title>
    <style>

        .conteiner{
            background-color: blue;
           display: flex;
           flex-flow: row wrap;
        }

        .item{
            background-color: brown;
           
            border: 2px solid black;
            text-align: center;
            flex-basis: 200px;
            
        }

      
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">outro conteudo</div>
        <div class="item">C</div>
        <div class="item">um conteudo bem maior</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">conteudo maior ainda, vai acupar mais espaço</div>

    </div>
</body>
</html>
