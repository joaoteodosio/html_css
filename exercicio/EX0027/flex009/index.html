<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box align- self</title>
    <style>

        .conteiner{
            background-color: blue;
            display: flex;
            flex-flow: row nowrap; 
            
        }

        .item{
            background-color: brown;
            
            border: 2px solid black;
            text-align: center;
            flex-basis: auto;
            
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>

    </div>
</body>
</html>
