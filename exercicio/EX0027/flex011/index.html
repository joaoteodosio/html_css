<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box  shring grow</title>
    <style>

        .conteiner{
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
            
            
        }

        div.item{
            background-color: brown;
            padding: 10px;
            border: 2px solid yellow;
            text-align: center;
            flex-basis: 250px;
            
        }
        div#cxA{
            /*flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;*/
            flex: 1 0 200px; /*simplificado*/
        }

        div#cxB{
            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px;*/
            flex: 1 1 150px;/* simplificado*/
            
        }

        div#cxC{
            /*flex-shrink: 8;
            flex-grow: 1;
            flex-basis: auto;*/
            flex: 8 1 auto;
            
        }

        

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
        
    </div>
</body>
</html>
