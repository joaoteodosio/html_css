<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex box  shring grow</title>
    <style>

        .conteiner{
            background-color: blue;
            display: flex;
            flex-flow: row nowrap;
            
            
        }

        .item{
            background-color: brown;
            padding: 10px;
            border: 2px solid yellow;
            text-align: center;
            flex-basis: 250px;
            
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item"></div>
        <div class="item">B</div>
        <div class="item">C</div>
        
    </div>
</body>
</html>
