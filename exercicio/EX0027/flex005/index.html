<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex centralizado</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        
        body{
            background-color: yellow;
        }

        main{
            background-color: blue;
            width: 80vw;
            height: 80vh;
            display: flex;
            flex-flow:row nowrap ;
            justify-content: center;
            align-items: center;
        }

        section{
            background-color: cyan
            ;
            height: 200px;
            width: 200px;
        }
        section, h1{
            color: #8d7d7d;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <h1>TELA DE LOGIN</h1>
        </section>
    </main>
</body>
</html>
